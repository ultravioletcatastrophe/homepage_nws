<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage NWS Weather demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #1e293b;
        color: #d7dee8;
        margin: 0;
        min-height: 100vh;
      }

      main {
        margin: 0 auto;
        max-width: 1210px;
        padding: 2.25rem 0;
      }

      #information-widgets,
      #widgets-wrap {
        align-items: center;
        display: flex;
        width: 100%;
      }

      .left-widgets {
        align-items: center;
        display: flex;
        gap: 1.4rem;
      }

      .brand {
        font-size: 1.25rem;
      }

      .metric {
        display: grid;
        font-size: 0.72rem;
        gap: 0.25rem;
        grid-template-columns: auto auto;
        min-width: 5rem;
      }

      .metric span:last-child {
        grid-column: 1 / -1;
        opacity: 0.55;
        text-align: center;
      }

      #information-widgets-right {
        align-items: center;
        display: flex;
        flex: 1 1 auto;
        margin-left: 0.75rem;
      }

      .datetime {
        font-size: 1.12rem;
        white-space: nowrap;
      }

      @media (max-width: 800px) {
        main {
          padding: 1rem;
        }

        #widgets-wrap {
          flex-wrap: wrap;
        }

        .left-widgets {
          width: 100%;
        }

        #information-widgets-right {
          flex-wrap: wrap;
          justify-content: center;
          margin: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="information-widgets">
        <div id="widgets-wrap">
          <div class="left-widgets">
            <span class="brand">homeserver</span>
            <span class="metric"><b>13%</b><span>CPU</span></span>
            <span class="metric"><b>13 GiB</b><span>Free</span></span>
            <span class="metric"><b>54.5°C</b><span>Temp</span></span>
          </div>
          <div id="information-widgets-right">
            <span class="datetime">Aug 30, 2026, 10:26 PM</span>
          </div>
        </div>
      </div>
    </main>

    <script>
      window.HOMEPAGE_NWS_WEATHER = {
        latitude: 39.7456,
        longitude: -97.0892,
        locationLabel: "Demo",
        timeZone: "America/Chicago",
        forecastUrl: "./forecast.json",
        hourlyUrl: "./hourly.json",
        detailsUrl: "https://www.weather.gov/",
        linkTarget: "_blank",
      };

      localStorage.setItem(
        "homepage-nws-weather:forecast:39.7456,-97.0892:us:v1",
        JSON.stringify({
          condition: "Partly Cloudy",
          detailedForecast: "Partly cloudy, with a low around 67. South wind around 8 mph.",
          temperature: 76,
          high: 84,
          low: 67,
          temperatureUnit: "F",
          humidity: 52,
          precipitation: 20,
          wind: "SSE 8 mph",
          solarEvent: { type: "sunset", time: "8:00 PM" },
          icon: "partly-night",
          updatedAt: Date.now(),
        }),
      );
    </script>
    <script src="../nws-weather.js?v=demo"></script>
  </body>
</html>
